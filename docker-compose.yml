services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: aira
      DB_USERNAME: aira
      DB_PASSWORD: secret
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "
        sleep 5 &&
        php artisan migrate &&
        php artisan aira:crawl --limit 100 &&
        php artisan aira:import-html-knowledge &&
        php artisan aira:index-static-pages &&
        php artisan serve --host=0.0.0.0 --port=8000
        "
    develop:
      watch:
        - action: sync
          path: .
          target: /var/www/html
          ignore:
            - .git/
            - dpuair_sisda-main/
            - node_modules/
            - vendor/
            - storage/framework/cache/
            - storage/framework/sessions/
            - storage/framework/views/
            - storage/logs/
        - action: rebuild
          path: composer.json
        - action: rebuild
          path: composer.lock
        - action: rebuild
          path: package.json

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: aira
      MYSQL_USER: aira
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
