

services:
    app:
        container_name: ${CONTAINER_NAME:-sisda_app}
        # Gunakan image dari GHCR atau build local jika tidak ada
        build:
            context: .
            dockerfile: Dockerfile
        image: ${DOCKER_IMAGE:-ghcr.io/dpuair-jatim/sisda:latest}
        
        restart: unless-stopped

        depends_on:
            - postgres
            - redis

        ports:
            - "${APP_PORT:-8081}:8081"

        develop:
            watch:
              - action: sync
                path: .
                target: /var/www/html       

              - action: rebuild
                path: Dockerfile        
              - action: rebuild
                path: composer.json     

              - action: rebuild
                path: composer.lock

        environment:
            # Application
            - APP_NAME=${APP_NAME:-SISDA}
            - APP_ENV=${APP_ENV:-production}
            - APP_KEY=${APP_KEY}
            - APP_DEBUG=${APP_DEBUG:-false}
            - APP_URL=${APP_URL}

            # Database
            - DB_CONNECTION=${DB_CONNECTION:-pgsql}
            - DB_HOST=postgres
            - DB_PORT=${DB_PORT:-5432}
            - DB_DATABASE=${DB_DATABASE}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}

            # Redis
            - REDIS_HOST=redis
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            - REDIS_PORT=${REDIS_PORT:-6379}

            # System
            - SESSION_DRIVER=${SESSION_DRIVER:-redis}
            - QUEUE_CONNECTION=${QUEUE_CONNECTION:-redis}
            - CACHE_STORE=${CACHE_STORE:-redis}
            - FILESYSTEM_DISK=${FILESYSTEM_DISK:-local}
 
        networks:
            - app_network

    postgres:
        image: postgres:17
        container_name: sisda_postgres
        restart: unless-stopped
        environment:
          POSTGRES_DB: ${DB_DATABASE:-sisda}
          POSTGRES_USER: ${DB_USERNAME:-postgres}
          POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
          - postgres_data:/var/lib/postgresql/data
        networks:
          - app_network

    redis:
        image: redis:8-alpine
        container_name: sisda_redis
        restart: unless-stopped
        volumes:
          - redis_data:/data
        networks:
          - app_network

volumes:
    postgres_data:
    redis_data:

networks:
    app_network:
        name: ${DOCKER_NETWORK_NAME:-sisda_network}
        driver: bridge
        
